<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutorials | Greg.Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#0d0a1a; }
  a { text-decoration:none; }
  a:hover { color:#7fe8f2; }

  @keyframes twinkle { 0%,100%{opacity:.15} 50%{opacity:1} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  .stars { position:absolute; inset:0; pointer-events:none; }
  .star { position:absolute; width:4px; height:4px; animation:twinkle 3s infinite; }

  .page {
    position:relative;
    width:100%;
    min-height:100vh;
    overflow:hidden;
    background:linear-gradient(#140e29 0%, #241a49 42%, #3d2464 70%, #6d3060 100%);
    font-family:'Press Start 2P', monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 20px 20px;
    box-sizing:border-box;
  }

  .content { position:relative; width:100%; max-width:1080px; display:flex; flex-direction:column; align-items:center; text-align:center; }

  .logo { animation:fadeIn 1.6s ease-out both; display:flex; flex-direction:column; align-items:center; gap:18px; }
  .tagline { font-size:11px; letter-spacing:6px; color:#7fe8f2; text-shadow:0 3px 0 #1c2f52; }
  .title {
    margin:0;
    font-size:clamp(24px,5vw,56px);
    line-height:1.15;
    color:#ffe9a8;
    letter-spacing:2px;
    text-align:center;
    text-shadow:4px 0 0 #2a1440, -4px 0 0 #2a1440, 0 -4px 0 #2a1440, 0 4px 0 #2a1440,
      0 10px 0 #d1356e, 0 18px 0 #7a1c4e, 0 26px 0 #2a1440;
  }
  .title .dot { color:#f7a8d8; }

  .links {
    margin-top:36px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:clamp(18px,4vw,40px);
    font-size:11px;
    animation:fadeIn 2s ease-out both;
  }

  .grid {
    width:100%;
    margin-top:48px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:28px;
    animation:fadeIn 2.2s ease-out both;
  }

  .card {
    display:flex;
    flex-direction:column;
    background:#1c1338;
    border:4px solid #2a1440;
    box-shadow:0 6px 0 #7a1c4e;
    text-align:left;
    color:inherit;
    font:inherit;
    padding:0;
    cursor:pointer;
    transition:transform .12s, box-shadow .12s, border-color .12s;
  }
  .card:hover, .card:focus-visible { transform:translateY(-4px); box-shadow:0 10px 0 #d1356e; border-color:#7fe8f2; outline:none; }
  .thumb { position:relative; aspect-ratio:16/9; background:#0d0a1a; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .play {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:28px; color:#ffe9a8; background:rgba(13,10,26,.35); text-shadow:3px 3px 0 #2a1440;
  }
  .card-body { padding:16px; display:flex; flex-direction:column; gap:12px; }
  .type { font-size:9px; letter-spacing:2px; color:#7fe8f2; }
  .card-title { font-size:11px; line-height:1.7; color:#ffe9a8; }

  .modal {
    position:fixed; inset:0; z-index:10; display:none;
    align-items:flex-start; justify-content:center;
    background:rgba(13,10,26,.88);
    font-family:'Press Start 2P', monospace;
    overflow-y:auto; padding:32px 16px; box-sizing:border-box;
  }
  .modal.open { display:flex; }
  .modal-box {
    position:relative; width:100%; max-width:1000px;
    background:#1c1338; border:4px solid #2a1440; box-shadow:0 8px 0 #7a1c4e;
    padding:20px; box-sizing:border-box; text-align:left;
  }
  .close {
    position:absolute; top:-4px; right:-4px; transform:translateY(-100%);
    background:none; border:0; font:inherit; font-size:11px; color:#f78ab8; cursor:pointer; padding:8px 0;
  }
  .close:hover { color:#7fe8f2; }
  .video { position:relative; aspect-ratio:16/9; background:#000; }
  .video iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .modal-title { margin:22px 0 14px; font-size:14px; font-weight:normal; line-height:1.6; color:#ffe9a8; }
  .desc { font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size:16px; line-height:1.7; color:#d8cdf5; margin:0 0 20px; white-space:pre-line; }
  .res-title { font-size:10px; letter-spacing:2px; color:#7fe8f2; margin-bottom:12px; }
  .res { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size:15px; line-height:1.5; }
  .res a { color:#f78ab8; text-decoration:underline; }
  .yt-fallback { margin-top:16px; font-size:9px; letter-spacing:1px; }
  .yt-fallback a { color:#ffe9a8; }

  .copyright {
    margin-top:50px;
    font-size:9px;
    letter-spacing:3px;
    color:#8f7fc2;
    padding-bottom:40px;
    animation:fadeIn 2.4s ease-out both;
  }
</style>
</head>
<body>
<div class="page">

  <div class="stars">
    <div class="star" style="left:6%; top:11%; background:#fff; animation-duration:3.1s;"></div>
    <div class="star" style="left:14%; top:24%; background:#9fe8ff; animation-duration:2.3s; animation-delay:.4s;"></div>
    <div class="star" style="left:21%; top:6%; background:#fff; animation-duration:4s; animation-delay:1.1s;"></div>
    <div class="star" style="left:31%; top:17%; background:#ffd479; animation-duration:2.8s; animation-delay:.7s;"></div>
    <div class="star" style="left:44%; top:5%; background:#fff; animation-duration:3.6s; animation-delay:.2s;"></div>
    <div class="star" style="left:57%; top:13%; background:#f7a8d8; animation-duration:2.6s; animation-delay:.9s;"></div>
    <div class="star" style="left:68%; top:8%; background:#fff; animation-duration:3.3s; animation-delay:1.4s;"></div>
    <div class="star" style="left:76%; top:23%; background:#9fe8ff; animation-duration:2.1s; animation-delay:.3s;"></div>
    <div class="star" style="left:88%; top:10%; background:#fff; animation-duration:3.9s; animation-delay:.6s;"></div>
    <div class="star" style="left:94%; top:29%; background:#ffd479; animation-duration:2.9s; animation-delay:1.2s;"></div>
    <div class="star" style="left:38%; top:32%; background:#fff; animation-duration:3.4s; animation-delay:1.7s;"></div>
    <div class="star" style="left:63%; top:28%; background:#fff; animation-duration:2.4s; animation-delay:.1s;"></div>
  </div>

  <div class="content">
    <div class="logo">
      <div class="tagline">&#9670; A DEV-REL ADVENTURE &#9670;</div>
      <h1 class="title">TUTORIALS</h1>
    </div>

    <div class="links">
      <a href="../" style="color:#ffe9a8;">HOME</a>
      <a href="https://www.linkedin.com/in/gregsvo/" style="color:#7fe8f2;">LINKEDIN</a>
    </div>

    <div class="grid" id="grid"></div>

    <div class="copyright">GREG.QUEST &mdash; &copy; 20XX</div>
  </div>

</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-box">
    <button class="close" id="close" type="button">[ESC] CLOSE</button>
    <div class="video" id="video"></div>
    <div class="yt-fallback"><a id="yt-link" href="#" target="_blank" rel="noopener">&#9654; WATCH ON YOUTUBE</a></div>
    <h2 class="modal-title" id="modal-title"></h2>
    <p class="desc" id="desc"></p>
    <div class="res-title">LINKS</div>
    <ul class="res" id="res"></ul>
  </div>
</div>

<script>
/*
  Add new tutorials to the TOP of this list.
  type: "video"   -> id (YouTube video id), description, links[]; thumbnail defaults to thumbs/<id>.jpg
  type: "writing" -> url (opens directly), thumb
*/
const TUTORIALS = [
  {
    type: "video",
    id: "Gi1dksUO6d0",
    title: "Postmark Webhooks Just Got 40% Faster — Here’s How to Use Them",
    description: "Postmark just released an update to their webhook delivery system, increasing the verification, setup, and delivery speeds!\n\nLearn how to configure, verify, and handle Postmark webhooks in your application to get real-time insights into your email events, using the Postmark Dashboard, MCP Server, and API.",
    links: [
      { label: "Postmark MCP Server Setup Tutorial", url: "https://youtu.be/eh_uz4U_gxQ" },
      { label: "Python Example Code", url: "https://github.com/gregsvo/postmark_webhooks" }
    ]
  },
  {
    type: "video",
    id: "DpCFHG37Tf8",
    title: "How to Set Up Postmark for Your Custom Domain (Step-by-Step)",
    description: "Setting up email delivery for a new domain doesn't have to be confusing! I walk you through how to connect your domain to Postmark so you can start sending reliable, authenticated emails in just a few minutes.\n\nI cover: setting up a server, configuring DKIM, CNAME (Return-Path), and DMARC DNS records, and verifying your records. Finally, we test it.",
    links: [
      { label: "Postmark MCP Server Guide", url: "https://youtu.be/eh_uz4U_gxQ" },
      { label: "Free DMARC tool", url: "https://dmarc.postmarkapp.com/" },
      { label: "Postmark", url: "https://postmarkapp.com" }
    ]
  },
  {
    type: "video",
    id: "eh_uz4U_gxQ",
    title: "Postmark MCP Server: 5 Minute Setup",
    description: "Learn how to connect the official Postmark MCP Server with Claude in 5 minutes. Whether you are building custom AI agents or streamlining transactional email management, this step-by-step guide walks you through setup, configuration, and practical use cases.",
    links: [
      { label: "Links to everything Postmark MCP", url: "https://postmarkapp.com/lp/mcp" },
      { label: "GitHub Repository & Setup Guide", url: "https://github.com/activecampaign/postmark-mcp" }
    ]
  },
  {
    type: "writing",
    title: "Sending bulk email in Python? Prioritize practices that get your mail delivered",
    url: "https://postmarkapp.com/blog/sending-bulk-email-in-python-prioritize-practices-that-get-your-mail-delivered",
    thumb: "thumbs/bulk-email-python.jpg"
  },
  {
    type: "writing",
    title: "Automate Python emails with attachments that get delivered",
    url: "https://postmarkapp.com/blog/automate-python-emails-with-attachments-that-get-delivered",
    thumb: "thumbs/python-attachments.jpg"
  },
  {
    type: "writing",
    title: "Sending mission-critical emails in Python: SMTP or API?",
    url: "https://postmarkapp.com/blog/sending-mission-critical-emails-in-python-smtp-or-api",
    thumb: "thumbs/smtp-or-api.png"
  }
];

const $ = id => document.getElementById(id);
const modal = $("modal"), video = $("video");
let lastFocus = null;

function el(tag, props = {}, children = []) {
  const n = Object.assign(document.createElement(tag), props);
  children.forEach(c => n.append(c));
  return n;
}

function card(t) {
  const isVideo = t.type === "video";
  const img = el("img", {
    src: t.thumb || `thumbs/${t.id}.jpg`, alt: "", loading: "lazy"
  });
  const thumb = el("div", { className: "thumb" }, [img]);
  if (isVideo) thumb.append(el("div", { className: "play", textContent: "▶" }));
  const body = el("div", { className: "card-body" }, [
    el("div", { className: "type", textContent: isVideo ? "🎬 VIDEO" : "✍️ WRITING" }),
    el("div", { className: "card-title", textContent: t.title })
  ]);
  const root = isVideo
    ? el("button", { className: "card", type: "button" })
    : el("a", { className: "card", href: t.url, target: "_blank", rel: "noopener" });
  root.append(thumb, body);
  if (isVideo) root.addEventListener("click", () => openModal(t));
  return root;
}

function openModal(t) {
  lastFocus = document.activeElement;
  video.replaceChildren(el("iframe", {
    src: `https://www.youtube.com/embed/${t.id}?autoplay=1&rel=0`,
    title: t.title,
    allow: "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share",
    referrerPolicy: "strict-origin-when-cross-origin",
    allowFullscreen: true
  }));
  $("yt-link").href = `https://www.youtube.com/watch?v=${t.id}`;
  $("modal-title").textContent = t.title;
  $("desc").textContent = t.description || "";
  $("res").replaceChildren(...(t.links || []).map(l =>
    el("li", {}, [el("a", { href: l.url, target: "_blank", rel: "noopener", textContent: l.label })])
  ));
  modal.classList.add("open");
  document.body.style.overflow = "hidden";
  $("close").focus();
}

function closeModal() {
  modal.classList.remove("open");
  video.replaceChildren();
  document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}

$("grid").append(...TUTORIALS.map(card));
$("close").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && modal.classList.contains("open")) closeModal(); });
</script>
</body>
</html>
